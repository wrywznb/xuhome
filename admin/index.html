<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>写作后台 · __SITE_TITLE__</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <span class="mark" aria-hidden="true">✦</span>
    <strong>__SITE_TITLE__</strong>
    <span class="chip">本地写作台</span>
  </div>
  <div class="topbar-actions">
    <a class="link" href="/" target="_blank" rel="noopener">查看博客 ↗</a>
    <button class="btn" id="btn-new" type="button">＋ 新建</button>
    <button class="btn btn-primary" id="btn-save" type="button">保存 <kbd>Ctrl S</kbd></button>
  </div>
</header>

<div class="app">
  <aside class="sidebar">
    <input id="search" class="search" type="search" placeholder="搜索文章…" autocomplete="off">
    <ul id="post-list" class="post-list"></ul>
    <p class="sidebar-foot"><span id="count">0</span> 篇 · 保存在 content/posts/</p>
  </aside>

  <main class="editor">
    <div class="fields">
      <label class="field field-title">
        <span>标题</span>
        <input id="f-title" type="text" placeholder="给文章起个名字">
      </label>
      <label class="field">
        <span>日期</span>
        <input id="f-date" type="date">
      </label>
      <label class="field">
        <span>标签</span>
        <input id="f-tags" type="text" placeholder="随笔, 技术">
      </label>
      <label class="field field-slug">
        <span>网址</span>
        <input id="f-slug" type="text" placeholder="留空自动生成" spellcheck="false">
      </label>
    </div>

    <label class="field field-summary">
      <span>摘要</span>
      <textarea id="f-summary" rows="2" placeholder="显示在列表和 RSS 里的一句话，留空则自动截取正文"></textarea>
    </label>

    <div class="editor-head">
      <div class="tabs">
        <button class="tab is-active" type="button" data-tab="write">正文</button>
        <button class="tab" type="button" data-tab="preview">预览</button>
      </div>
      <div class="editor-tools">
        <input id="file-input" type="file" accept="image/*" multiple hidden>
        <button class="btn btn-small" id="btn-image" type="button">＋ 插入图片</button>
        <span class="tool-hint">也可以直接粘贴或拖进来</span>
      </div>
      <span class="status" id="status">就绪</span>
    </div>

    <div class="editor-body">
      <textarea id="content" class="content" spellcheck="false" placeholder="用 Markdown 写正文…

## 小标题
**加粗**、*斜体*、`行内代码`
- 列表项
> 引用

写完点右上角保存，刷新博客即可看到。"></textarea>
      <div id="preview" class="preview" hidden></div>
    </div>

    <div class="editor-foot">
      <label class="check"><input type="checkbox" id="f-draft"> 存为草稿（不在网站上显示）</label>
      <button class="btn btn-danger" id="btn-delete" type="button">删除这篇</button>
    </div>
  </main>
</div>

<div class="toast" id="toast" hidden></div>

<script src="admin.js"></script>
</body>
</html>
